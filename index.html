<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>סיכום מיפוי והמלצות</title>
<style>
@font-face{font-family:Rubik;font-weight:400;src:url(fonts/Rubik-400-hebrew.woff2) format("woff2");unicode-range:U+0590-05FF,U+200C-2010,U+20AA}
@font-face{font-family:Rubik;font-weight:400;src:url(fonts/Rubik-400-latin.woff2) format("woff2");unicode-range:U+0000-00FF}
@font-face{font-family:Rubik;font-weight:600;src:url(fonts/Rubik-600-hebrew.woff2) format("woff2");unicode-range:U+0590-05FF,U+200C-2010,U+20AA}
@font-face{font-family:"Open Sans";font-weight:400;src:url(fonts/OpenSans-400-hebrew.woff2) format("woff2");unicode-range:U+0590-05FF,U+200C-2010,U+20AA}
@font-face{font-family:"Open Sans";font-weight:600;src:url(fonts/OpenSans-600-hebrew.woff2) format("woff2");unicode-range:U+0590-05FF,U+200C-2010,U+20AA}
@font-face{font-family:"Open Sans";font-weight:400;src:url(fonts/OpenSans-400-latin.woff2) format("woff2");unicode-range:U+0000-00FF}
:root{--pink:#FDE1EA;--pink2:#FBC5D6;--fuc:#D14175;--fuc2:#B8236B;--mint:#EEF8F3;--sky:#E8F3FA;--cream:#FEF6F5;--ink:#3A2225;--line:#EAC9D3}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:"Open Sans",Rubik,sans-serif;font-size:17px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 40px}
h1,h2,h3{font-family:Rubik,sans-serif;font-weight:600;margin:0}
h1{font-size:26px;color:var(--ink)}
h2{font-size:21px;margin:22px 0 8px}
h3{font-size:18px;color:var(--fuc2);margin:18px 0 6px}
.top{background:linear-gradient(135deg,var(--pink),var(--cream) 60%,var(--mint));border-radius:22px;padding:18px 20px;text-align:center}
.top p{margin:6px 0 0}
.steps{display:flex;gap:8px;justify-content:center;margin:14px 0;flex-wrap:wrap}
.steps button{font:600 15px Rubik,sans-serif;border:2px solid var(--pink2);background:#fff;color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer}
.steps button.on{background:var(--pink2);border-color:var(--fuc)}
.card{border:2px solid var(--line);border-radius:20px;padding:14px 16px;margin:12px 0;background:#fff}
.card.mint{background:var(--mint)}.card.sky{background:var(--sky)}.card.pink{background:var(--cream)}
label.row{display:flex;gap:10px;align-items:flex-start;padding:9px 6px;border-radius:12px;cursor:pointer}
label.row:hover{background:var(--cream)}
label.row input{width:22px;height:22px;margin-top:3px;accent-color:var(--fuc);flex:none}
.tag{font:600 12px Rubik,sans-serif;border-radius:999px;padding:2px 9px;margin-inline-start:8px;white-space:nowrap}
.tag.s{background:#DDF2E8;color:#26664A}.tag.f{background:var(--pink);color:var(--fuc2)}.tag.r{background:#FFF1C9;color:#7A5A00}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields div{display:flex;flex-direction:column}
.fields label{font:600 14px Rubik,sans-serif;margin-bottom:4px}
input[type=text],input[type=date],textarea{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:80px}
.btn{font:600 17px Rubik,sans-serif;border:0;border-radius:999px;padding:12px 26px;background:linear-gradient(#F2778F,#EF406E);color:#fff;cursor:pointer;box-shadow:0 3px 8px rgba(239,64,110,.28)}
.btn.alt{background:#fff;color:var(--fuc2);border:2px solid var(--pink2);box-shadow:none}
.nav{display:flex;gap:10px;justify-content:center;margin:18px 0;flex-wrap:wrap}
.pad{border:2px dashed var(--pink2);border-radius:16px;background:#fff;touch-action:none;width:100%;height:240px;display:block}
.padbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.padbar button{font:600 14px Rubik,sans-serif;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer}
.padbar button.on{border-color:var(--fuc);background:var(--pink)}
.hint{font-size:15px;color:#6B4A50}
.suggest{background:#FFF8E1}
.rep h2{border-bottom:3px solid var(--pink2);padding-bottom:4px}
.rep ul{margin:6px 0 0;padding-inline-start:22px}
.rep img{max-width:100%;border:2px solid var(--line);border-radius:12px;margin-top:6px}
.meta{display:flex;gap:18px;flex-wrap:wrap;font-weight:600}
.sig{margin-top:18px;text-align:center;color:var(--fuc2);font:600 15px Rubik,sans-serif}
.hide{display:none}
@media(max-width:560px){.fields{grid-template-columns:1fr}.btn{width:100%}}
@media print{.noprint,.steps,.nav,.top{display:none!important}.wrap{padding:0}.card{break-inside:avoid;border-color:#ddd}body{font-size:14px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top noprint">
    <h1>סיכום המיפוי וההמלצות</h1>
    <p>בסוף המיפוי: מסמנות מה נכון לגבי הילד, בוחרות המלצות, ומקבלות דוח מסודר להדפסה או לשמירה כ-PDF.</p>
  </div>
  <div class="steps noprint" id="steps"></div>
  <div id="view"></div>
  <div class="sig noprint">חן קלימיאן | קלינאית תקשורת ומדריכת הורים. הנתונים נשמרים רק במכשיר שלך ולא נשלחים לשום מקום.</div>
</div>
<script>
const AREAS=[
 {id:'a',title:'שיום אותיות ושליפה',items:[
  ['a1','משיים את רוב האותיות בקצב סביר','s'],
  ['a2','משיים אותיות לאט ובהיסוס','f'],
  ['a3','מתבלבל באותיות דומות בצורה (ב/כ, ד/ר, ה/ח/ת, ו/ז/ן)','f'],
  ['a4','זקוק לרמז, כמו צליל פותח או תומך זיכרון, כדי לשלוף את שם האות','f'],
  ['a5','מזהה שהאות מוכרת לו אבל לא מצליח לשלוף את שמה','f'],
  ['a6','הדיוק יורד ככל שהמבדק מתקדם','f']]},
 {id:'b',title:'כתיבת אותיות',items:[
  ['b1','כותב אותיות מזיכרון בלי מודל','s'],
  ['b2','כותב חלק מהאותיות בהיפוך (כמו בראי)','f'],
  ['b3','מתעייף מהר או מתקשה באחיזת העט','f'],
  ['b4','מתקשה לכתוב אות בלי שמישהו יראה לו אותה','f']]},
 {id:'c',title:'כתיב פונטי ומודעות לצלילים',items:[
  ['c1','מפרק מילה לצלילים ומתאים אות לכל צליל','s'],
  ['c2','מדלג על צלילים באמצע המילה','f'],
  ['c3','כותב רק את האות הפותחת','f'],
  ['c4','מתקשה להתחיל לכתוב מילה','f']]},
 {id:'d',title:'חשבון',items:[
  ['d1','פותר בעיות מילוליות עד 10 בעל פה','s'],
  ['d2','סופר עד 20 בלי טעויות','s'],
  ['d3','מכיר את הספרות ויודע לכתוב אותן','s'],
  ['d4','זקוק לאצבעות או לחפצים כדי לפתור','f']]},
 {id:'e',title:'קשב והתנהלות בזמן המבדק',items:[
  ['e1','שומר על קשב לאורך כל המבדק','s'],
  ['e2','זקוק להפסקות או לתיווך כדי להמשיך','f'],
  ['e3','מוסח בקלות מגירויים בחדר','f'],
  ['e4','מוותר או מתוסכל מהר כשקשה לו','f'],
  ['e5','מגיב טוב לעידוד ונהנה לשחק','s']]}
];
const RECS=[
 ['r1','להתחיל בקבוצות אותיות קטנות (3-4 בשבוע), עם תומך זיכרון וסיפור לכל אות',['a2','a4','a5','a6']],
 ['r2','לתרגל שליפה במשחקים קצרים של 5-7 דקות, לעתים קרובות במקום מפגש ארוך אחד',['a2','a5','a6','e2']],
 ['r3','לעבוד על אותיות מבולבלות בזוגות, עם תומך זיכרון נפרד לכל אחת מהן',['a3','b2']],
 ['r4','להתחיל במודעות לצלילים (צליל פותח וסוגר) ורק אחר כך לחבר לאותיות',['c2','c3','c4']],
 ['r5','לתרגל כתיבה דרך החושים: גואש, קצף גילוח, אותיות בקערת אורז',['b2','b3','b4']],
 ['r6','לחזק את אחיזת העט ואת המוטוריקה העדינה לפני כתיבה ארוכה',['b3']],
 ['r7','לצמצם גירויים בסביבה ולחלק את המשימה לחלקים קצרים עם חיזוק בין חלק לחלק',['e2','e3']],
 ['r8','לפתוח כל מפגש בחזרה קצרה על מה שנלמד ולסיים בהצלחה, כדי לבנות ביטחון',['e4','a6']],
 ['r9','לשלב תנועה בלמידה (קפיצה על אות, חיפוש אות בחדר)',['e2','e3']],
 ['r10','לתרגל חשבון בעזרת חפצים ומשחקים, ולעבור לבעיות מילוליות בעל פה בהדרגה',['d4']],
 ['r11','להמליץ להורים על תרגול יומי קצר בבית (5-10 דקות) עם משחקים דיגיטליים מבוקרים',['a2','a5','c2']],
 ['r12','לשקול הערכה מקצועית נוספת (קלינאית תקשורת, ריפוי בעיסוק או בדיקת קשב) כשהקושי מתמשך ומשפיע על הלמידה',['a5','a6','e2','e3']],
 ['r13','להדגיש את ההצלחות ולתת לילד לחוות שליטה, כדי לשמור על רצון ללמוד',['e4','a2']]
];
const STEPS=['פרטים','היגדים על הילד','המלצות','דוח סיכום'];
let S={step:0,name:'',age:'',date:new Date().toISOString().slice(0,10),by:'',c:{},r:{},extra:'',n1:'',n2:''};
try{const t=localStorage.getItem('mipuy-v1');if(t)S=Object.assign(S,JSON.parse(t))}catch(e){}
const save=()=>{try{localStorage.setItem('mipuy-v1',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
function nav(){return `<div class="nav noprint">${S.step>0?'<button class="btn alt" onclick="go(S.step-1)">חזרה</button>':''}${S.step<3?'<button class="btn" onclick="go(S.step+1)">'+(S.step==2?'ליצירת הדוח':'להמשך')+'</button>':''}</div>`}
function go(n){S.step=n;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function bind(k){return e=>{S[k]=e.target.value;save()}}
function pad(id,key,label){return `<div class="card sky"><h3>${label}</h3><div class="padbar"><button data-p="${id}" data-c="#3A2225" class="on">עט כהה</button><button data-p="${id}" data-c="#D14175">עט ורוד</button><button data-p="${id}" data-c="erase">מחק קטן</button><button data-p="${id}" data-c="clear">נקי הכול</button></div><canvas class="pad" id="${id}"></canvas><div class="hint">אפשר לכתוב באצבע, בעט מגע או בעכבר.</div></div>`}
function initPad(id,key){
 const cv=$(id);if(!cv)return;const dpr=window.devicePixelRatio||1;const w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;
 const g=cv.getContext('2d');g.scale(dpr,dpr);g.lineCap='round';g.lineJoin='round';let col='#3A2225',erase=false,draw=false,lx=0,ly=0;
 if(S[key]){const im=new Image();im.onload=()=>g.drawImage(im,0,0,w,h);im.src=S[key]}
 const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
 cv.onpointerdown=e=>{draw=true;[lx,ly]=pos(e);cv.setPointerCapture(e.pointerId);e.preventDefault()};
 cv.onpointermove=e=>{if(!draw)return;const[x,y]=pos(e);g.globalCompositeOperation=erase?'destination-out':'source-over';g.strokeStyle=col;g.lineWidth=erase?22:3;g.beginPath();g.moveTo(lx,ly);g.lineTo(x,y);g.stroke();lx=x;ly=y;e.preventDefault()};
 const end=()=>{if(!draw)return;draw=false;const o=document.createElement('canvas');o.width=w;o.height=h;const og=o.getContext('2d');og.fillStyle='#fff';og.fillRect(0,0,w,h);og.drawImage(cv,0,0,w,h);S[key]=o.toDataURL('image/png');save()};
 cv.onpointerup=end;cv.onpointercancel=end;
 document.querySelectorAll(`button[data-p="${id}"]`).forEach(b=>b.onclick=()=>{const c=b.dataset.c;if(c==='clear'){g.globalCompositeOperation='source-over';g.clearRect(0,0,w,h);S[key]='';save();return}
  document.querySelectorAll(`button[data-p="${id}"]`).forEach(x=>x.classList.remove('on'));b.classList.add('on');erase=c==='erase';if(!erase)col=c});
}
function render(){
 $('steps').innerHTML=STEPS.map((t,i)=>`<button class="${i==S.step?'on':''}" onclick="go(${i})">${i+1}. ${t}</button>`).join('');
 const v=$('view');
 if(S.step==0){
  v.innerHTML=`<div class="card pink"><h2 style="margin-top:0">פרטי הילד והמיפוי</h2><div class="fields">
  <div><label>שם הילד</label><input type="text" id="f_name" value="${esc(S.name)}"></div>
  <div><label>גיל</label><input type="text" id="f_age" value="${esc(S.age)}"></div>
  <div><label>תאריך המיפוי</label><input type="date" id="f_date" value="${esc(S.date)}"></div>
  <div><label>שם המעבירה</label><input type="text" id="f_by" value="${esc(S.by)}"></div></div>
  <p class="hint">קודם עוברות על המיפוי עם הילד (שיום אותיות, כתיבת אותיות, כתיב פונטי וחשבון), ואז ממשיכות לשלב הבא.</p></div>`+nav();
  [['name','f_name'],['age','f_age'],['date','f_date'],['by','f_by']].forEach(([k,id])=>$(id).oninput=bind(k));
 }else if(S.step==1){
  v.innerHTML=`<div class="card pink"><h2 style="margin-top:0">מסמנות את ההיגדים הנכונים לגבי ${esc(S.name)||'הילד'}</h2><p class="hint">אפשר לסמן כמה היגדים בכל תחום, ולהשאיר ריק מה שלא רלוונטי.</p></div>`+
  AREAS.map(a=>`<div class="card ${a.id=='e'?'mint':''}"><h3>${a.title}</h3>${a.items.map(([id,t,k])=>`<label class="row"><input type="checkbox" data-c="${id}" ${S.c[id]?'checked':''}><span>${t}<span class="tag ${k}">${k=='s'?'חוזקה':'לחיזוק'}</span></span></label>`).join('')}</div>`).join('')+
  pad('pad1','n1','הערות בכתב יד על המיפוי')+nav();
  v.querySelectorAll('input[data-c]').forEach(x=>x.onchange=()=>{S.c[x.dataset.c]=x.checked;save()});initPad('pad1','n1');
 }else if(S.step==2){
  const sug=RECS.filter(r=>r[2].some(i=>S.c[i]));
  v.innerHTML=`<div class="card pink"><h2 style="margin-top:0">בוחרות המלצות</h2><p class="hint">ההמלצות שמסומנות כ"מומלץ לפי הסימון" נבחרו לפי ההיגדים שסימנת. אפשר לבחור, להוריד ולהוסיף משלך.</p>
  ${sug.length?'<button class="btn alt" id="selsug">לסמן את כל המומלצות</button>':''}</div>
  <div class="card">${RECS.map(([id,t,w])=>`<label class="row ${w.some(i=>S.c[i])?'suggest':''}"><input type="checkbox" data-r="${id}" ${S.r[id]?'checked':''}><span>${t}${w.some(i=>S.c[i])?'<span class="tag r">מומלץ לפי הסימון</span>':''}</span></label>`).join('')}
  <h3>המלצה נוספת בכתב</h3><textarea id="extra">${esc(S.extra)}</textarea></div>`+
  pad('pad2','n2','הערות בכתב יד על ההמלצות')+nav();
  v.querySelectorAll('input[data-r]').forEach(x=>x.onchange=()=>{S.r[x.dataset.r]=x.checked;save()});
  $('extra').oninput=bind('extra');initPad('pad2','n2');
  const b=$('selsug');if(b)b.onclick=()=>{sug.forEach(r=>S.r[r[0]]=true);save();render()};
 }else{
  const sel=a=>a.items.filter(([id])=>S.c[id]);
  const str=AREAS.flatMap(a=>sel(a).filter(i=>i[2]=='s').map(i=>i[1]));
  const foc=AREAS.map(a=>[a.title,sel(a).filter(i=>i[2]=='f').map(i=>i[1])]).filter(x=>x[1].length);
  const rec=RECS.filter(r=>S.r[r[0]]).map(r=>r[1]);if(S.extra.trim())rec.push(S.extra.trim());
  const d=S.date?S.date.split('-').reverse().join('.'):'';
  v.innerHTML=`<div class="card rep" id="report"><h2 style="margin-top:0">דוח סיכום מיפוי: הכנה לכיתה א'</h2>
  <div class="meta"><span>שם: ${esc(S.name)||'___'}</span><span>גיל: ${esc(S.age)||'___'}</span><span>תאריך: ${esc(d)}</span><span>מעבירה: ${esc(S.by)||'___'}</span></div>
  <h2>חוזקות</h2>${str.length?'<ul>'+str.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>':'<p class="hint">לא סומנו חוזקות.</p>'}
  <h2>מוקדים לחיזוק</h2>${foc.length?foc.map(([t,l])=>`<h3>${t}</h3><ul>${l.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`).join(''):'<p class="hint">לא סומנו מוקדים לחיזוק.</p>'}
  ${S.n1?`<h3>הערות בכתב יד על המיפוי</h3><img src="${S.n1}" alt="">`:''}
  <h2>המלצות</h2>${rec.length?'<ul>'+rec.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>':'<p class="hint">לא נבחרו המלצות.</p>'}
  ${S.n2?`<h3>הערות בכתב יד על ההמלצות</h3><img src="${S.n2}" alt="">`:''}
  <p class="hint" style="margin-top:16px">הדוח הוא כלי עבודה ואינו אבחון. חן קלימיאן | לדבר עם ילדים</p></div>
  <div class="nav noprint"><button class="btn" onclick="window.print()">הדפסה או שמירה כ-PDF</button><button class="btn alt" id="cp">העתקת הסיכום כטקסט</button><button class="btn alt" onclick="go(2)">חזרה לעריכה</button></div>
  <div class="nav noprint"><button class="btn alt" id="rs">ילד חדש (מנקה את הכול)</button></div>`;
  $('cp').onclick=async()=>{const t=['דוח סיכום מיפוי: '+(S.name||''),'תאריך: '+d,'','חוזקות:',...str.map(x=>'- '+x),'','מוקדים לחיזוק:',...foc.flatMap(([a,l])=>[a+':',...l.map(x=>'- '+x)]),'','המלצות:',...rec.map(x=>'- '+x)].join('\n');try{await navigator.clipboard.writeText(t);$('cp').textContent='הועתק'}catch(e){prompt('העתיקי את הסיכום:',t)}};
  $('rs').onclick=()=>{if(confirm('למחוק את כל מה שהוזן ולהתחיל ילד חדש?')){S={step:0,name:'',age:'',date:new Date().toISOString().slice(0,10),by:S.by,c:{},r:{},extra:'',n1:'',n2:''};save();render()}};
 }
}
render();
</script>
</body>
</html>
